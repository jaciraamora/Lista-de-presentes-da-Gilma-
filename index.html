<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎁 Lista de presentes da Gilma</title>

<style>
body {
  font-family: "Poppins", sans-serif;
  background: linear-gradient(to bottom, #FAFDF1, #F1F5E1);
  margin: 0;
  padding: 20px;
  color: #ADBA78;
}

h1 {
  text-align: center;
  color: #B1C170;
  font-size: 22px;
  margin-bottom: 10px;
}

#contador {
  text-align: center;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 20px;
  color: #B1C170;
}

ul {
  list-style: none;
  padding: 0;
  max-width: 700px;
  margin: 0 auto;
}

li {
  background: white;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: transform 0.2s;
  color: #4a004a;
}

li:hover {
  transform: scale(1.02);
}

button {
  background: #B0BE78;
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #7a005e;
}

button:disabled {
  background: grey;
  cursor: not-allowed;
}

.reservadoPor {
  color: grey;
  font-style: italic;
  font-size: 14px;
}
</style>
</head>

<body>

<h1>💚Lista de presentes da Gilma 💚</h1>

<div id="contador">0 / 42</div>

<ul id="listaPresentes"></ul>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";


/* CONFIGURAÇÃO DO FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyCkYqEK6h980afoiAAinQ0YY0N1pC5i9SA",
  authDomain: "lista-de-presentes-gil.firebaseapp.com",
  databaseURL: "https://lista-de-presentes-gil-default-rtdb.firebaseio.com",
  projectId: "lista-de-presentes-gil",
  storageBucket: "lista-de-presentes-gil.firebasestorage.app",
  messagingSenderId: "31477192399",
  appId: "1:31477192399:web:de4d7d0c85170a613409ba"
};


/* INICIALIZA O FIREBASE */

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


/*
IMPORTANTE:
Os teus presentes estão diretamente na raiz
do Firebase.

Por isso usamos:
ref(db)
e NÃO:
ref(db, "presentes")
*/

const listaRef = ref(db);


/* ATUALIZA O CONTADOR */

function atualizarContador(dados) {

  const total = Object.keys(dados).length;

  const reservados = Object.values(dados)
    .filter(item => item && item.reservado === true)
    .length;

  const restantes = total - reservados;

  document.getElementById("contador").innerText =
    `${reservados} / ${restantes}`;
}


/* ATUALIZA A LISTA EM TEMPO REAL */

onValue(listaRef, (snapshot) => {

  const dados = snapshot.val();

  if (!dados) {
    document.getElementById("listaPresentes").innerHTML =
      "<li>Nenhum presente encontrado.</li>";

    document.getElementById("contador").innerText = "0 / 0";

    return;
  }

  atualizarContador(dados);

  let html = "";

  for (let id in dados) {

    const item = dados[id];

    /* Ignora qualquer informação que não seja um presente */
    if (!item || !item.nome) continue;

    html += `
      <li>

        <div>

          <b>${item.nome}</b><br>

          ${
            item.reservado
            ? `<span class="reservadoPor">
                Reservado por: ${item.por || ""}
              </span>`
            : "Disponível"
          }

        </div>

        ${
          !item.reservado
          ? `<button onclick="reservar('${id}')">
              Reservar
            </button>`
          : `<button disabled>
              Reservado
            </button>`
        }

      </li>
    `;
  }

  document.getElementById("listaPresentes").innerHTML = html;

});


/* FUNÇÃO DE RESERVA */

window.reservar = function(id) {

  const nome = prompt("Digite seu nome:");

  if (!nome) return;

  update(ref(db, id), {

    reservado: true,

    por: nome

  });

};

</script>

</body>
</html>
